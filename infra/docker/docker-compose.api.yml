name: poetry-pottery

include:
  - docker-compose.db.yml

services:
  api:
    build:
      context: ../../api
      # Dockerfile lives outside the build context (relative to the context dir).
      dockerfile: ../infra/docker/Dockerfile.api
    container_name: poetry-pottery-api
    restart: unless-stopped
    # Runtime app env (Clerk keys, schema key, log level, throttles) comes from api/.env.
    env_file: ../../api/.env
    # api/.env points at host ports; inside the network the siblings are reached by service name.
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-poetry}:${POSTGRES_PASSWORD:-poetry}@postgres:5432/${POSTGRES_DB:-poetry_pottery}"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-poetry}:${RABBITMQ_PASSWORD:-poetry}@rabbitmq:5672"
      EMBEDDINGS_CACHE_DIR: "/app/.cache/models"
    ports:
      # Bound to loopback; nginx terminates TLS and proxies to it. Set API_BIND_HOST to expose it elsewhere.
      - "${API_BIND_HOST:-127.0.0.1}:6060:6060"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # One-off tools container on the build stage (has the Prisma CLI and ts-node):
  #   docker compose -f infra/docker/docker-compose.api.yml run --rm migrate
  #   docker compose -f infra/docker/docker-compose.api.yml run --rm migrate pnpm db:seed
  migrate:
    profiles: ["tools"]
    build:
      context: ../../api
      dockerfile: ../infra/docker/Dockerfile.api
      target: build
    env_file: ../../api/.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-poetry}:${POSTGRES_PASSWORD:-poetry}@postgres:5432/${POSTGRES_DB:-poetry_pottery}"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-poetry}:${RABBITMQ_PASSWORD:-poetry}@rabbitmq:5672"
      QUEUE_CONSUMERS_ENABLED: "false"
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

