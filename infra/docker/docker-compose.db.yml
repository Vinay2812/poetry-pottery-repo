name: poetry-pottery

networks:
  backend:

services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: poetry-pottery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poetry}
      POSTGRES_DB: ${POSTGRES_DB:-poetry_pottery}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-poetry} -d ${POSTGRES_DB:-poetry_pottery}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: poetry-pottery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6381}:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: poetry-pottery-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-poetry}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-poetry}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_HOST:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - backend
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
