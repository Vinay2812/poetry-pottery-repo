query CommissionOptions {
  commissionOptions {
    piece_types
    sizes
    glazes {
      slug
      name
      color_code
    }
  }
}

query CommissionPieces($limit: Int) {
  commissionPieces(limit: $limit) {
    ...ProductCard
  }
}

mutation CreateCommissionRequest($input: CommissionRequestInput!) {
  createCommissionRequest(input: $input) {
    id
    piece_type
    size
    glaze
    created_at
  }
}
