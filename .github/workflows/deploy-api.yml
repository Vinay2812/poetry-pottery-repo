name: Deploy API

# Ships main to the server whenever the API or the infra changes; the storefront ships from Vercel.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The key lives in the env bucket, so the only secrets here are the R2 ones and the host.
      - name: Fetch the SSH key from R2 and record the server's host key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_ENV_BUCKET }}
          KEY_OBJECT: ${{ vars.DEPLOY_SSH_KEY_OBJECT || 'vinay-personal-project.pem' }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          aws s3 cp "s3://$BUCKET/$KEY_OBJECT" ~/.ssh/deploy_key --endpoint-url "$R2_ENDPOINT" --only-show-errors
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      # ~/deploy.sh on the server exports its own credentials, GITHUB_ACCESS_TOKEN among them.
      - name: Run ~/deploy.sh on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$USER@$HOST" '~/deploy.sh'
